[package]
name = "crisis-command-center"
version = "1.0.0"
description = "Livestream Crisis Command Center — giám sát & xử lý khủng hoảng livestream"
authors = ["pbminhtedxhcmiu-svg"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
