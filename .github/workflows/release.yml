name: Release

# Chạy khi push tag v* (phát hành) hoặc thủ công (kiểm tra pipeline).
# Luồng: test (typecheck/lint/tests/build/smoke) → docker (build + smoke container)
#        → release (đính image .tar.gz vào GitHub Release nếu là tag).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, lint, tests, build & smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Prepare test database
        run: |
          npx prisma migrate deploy
          node prisma/seed.mjs

      - name: Run tests (unit + integration)
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          DATABASE_URL: file:./build-placeholder.db

      - name: Prepare runtime database
        run: |
          npx prisma migrate deploy
          node prisma/seed.mjs
        env:
          DATABASE_URL: file:./ci.db

      - name: Smoke test production server
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health
          node tests/api-smoke.mjs http://localhost:3000
          kill $SERVER_PID
        env:
          DATABASE_URL: file:./ci.db

  docker:
    name: Build Docker image & container smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: crisis-command-center:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container, seed & verify /api/health
        run: |
          docker run -d --name ccc-smoke -p 3100:3000 \
            -v ccc-data:/app/data \
            -e DATABASE_URL="file:/app/data/ci.db" \
            crisis-command-center:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3100/api/health
          docker exec ccc-smoke npx --no-install prisma db seed
          node tests/api-smoke.mjs http://localhost:3100
          docker rm -f ccc-smoke

      - name: Export image artifact
        run: docker save crisis-command-center:${{ github.sha }} | gzip > crisis-command-center-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: crisis-command-center-image.tar.gz
          retention-days: 7

  release:
    name: Attach image to GitHub Release
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --notes "Automated release $TAG"
          gh release upload "$TAG" crisis-command-center-image.tar.gz --clobber \
            --repo "$GITHUB_REPOSITORY"
