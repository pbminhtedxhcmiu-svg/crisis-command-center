name: Desktop

# Build ứng dụng desktop (Tauri v2) cho Windows & macOS khi push tag v*
# hoặc chạy thủ công. Sản phẩm: installer .msi/.nsis (Windows), .dmg/.app (macOS)
# được đính kèm GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: windows
            name: Windows x64 (MSI + NSIS)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
            node-runtime: runtime-win
          - key: macos
            name: macOS Universal (DMG + APP)
            os: macos-latest
            target: universal-apple-darwin
            # universal-apple-darwin không phải std target — cài 2 target thật,
            # tauri build tự ghép universal bằng lipo
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
            bundles: dmg,app
            node-runtime: runtime-mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next standalone bundle
        run: npm run build
        env:
          DATABASE_URL: file:./build-placeholder.db

      # Node sidecar runtime cho nền tảng đích (desktop app khởi động Next server bằng nó)
      - name: Download Node runtime (win)
        if: matrix.node-runtime == 'runtime-win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .node-runtime | Out-Null
          Invoke-WebRequest -Uri https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip -OutFile .node-runtime/node.zip
          Expand-Archive .node-runtime/node.zip -DestinationPath .node-runtime
          "DESKTOP_NODE_DIR=$((Resolve-Path .node-runtime/node-v22.14.0-win-x64).Path)" >> $env:GITHUB_ENV

      - name: Download Node runtime (mac)
        if: matrix.node-runtime == 'runtime-mac'
        run: |
          curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-darwin-arm64.tar.gz | tar -xz -C .
          mv node-v22.14.0-darwin-arm64 .node-runtime
          echo "DESKTOP_NODE_DIR=$PWD/.node-runtime" >> $GITHUB_ENV

      # macOS Universal: node sidecar phải là binary universal — lipo ghép 2 kiến trúc cùng version
      - name: Make universal node (mac)
        if: matrix.node-runtime == 'runtime-mac'
        run: |
          mkdir -p .node-x64 && curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-darwin-x64.tar.gz | tar -xz -C .node-x64 --strip-components 1
          mkdir -p .node-universal/bin
          lipo -create .node-runtime/bin/node .node-x64/bin/node -output .node-universal/bin/node
          lipo -info .node-universal/bin/node
          echo "DESKTOP_NODE_DIR=$PWD/.node-universal" >> $GITHUB_ENV

      - name: Prepare desktop runtime
        run: node scripts/prepare-desktop.mjs --target=${{ matrix.target }}

      - name: Build desktop app (Tauri)
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # Ký gói cập nhật (updater) — secret đã set qua `gh secret set`
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path "*/release/bundle/*" \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} dist/ \; 2>/dev/null || true
          # Bản cập nhật có chữ ký cho auto-updater (Tauri v2):
          #   NSIS  -> <setup>.exe       + <setup>.exe.sig
          #   macOS -> <name>.app.tar.gz + <name>.app.tar.gz.sig
          find src-tauri/target -path "*/release/bundle/*" -name "*.exe.sig" -exec cp {} dist/ \; 2>/dev/null || true
          find src-tauri/target -path "*/release/bundle/*" -name "*.msi.sig" -exec cp {} dist/ \; 2>/dev/null || true
          find src-tauri/target -path "*/release/bundle/*" \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.key }}
          path: dist/*
          retention-days: 7

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated desktop release $TAG"
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

          # Sinh latest.json (manifest auto-updater) sau khi CẢ 2 nền tảng đã upload đủ.
          # Chạy ở job windows (job cuối theo alphabetical có thể mac trước — dùng phiên bản từ tauri.conf.json).
          # Đánh dấu bằng file sentinel để chỉ chạy 1 lần: tải release, đủ nsis.zip + app.tar.gz thì sinh.


  # Manifest auto-updater: chạy SAU khi cả 2 nền tảng đã upload đủ artifact
  # (nhét vào 1 job của matrix là sai thứ tự — windows xong trước mac).
  updater-manifest:
    name: Updater manifest (latest.json)
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Generate & upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Release phải published (không draft) thì endpoint theo tag mới thấy
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY" || true
          WIN_ZIP=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith("x64-setup.exe")) | .name' | head -1)
          WIN_SIG=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith("x64-setup.exe.sig")) | .name' | head -1)
          MAC_TGZ=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .name' | head -1)
          MAC_SIG=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".app.tar.gz.sig")) | .name' | head -1)
          test -n "$WIN_ZIP" && test -n "$WIN_SIG" && test -n "$MAC_TGZ" && test -n "$MAC_SIG"
          echo "win=$WIN_ZIP mac=$MAC_TGZ"
          DL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Tải sig qua browser_download_url (Contents API KHÔNG đọc được release asset)
          curl -fsSL "$DL/$WIN_SIG" -o win.sig
          curl -fsSL "$DL/$MAC_SIG" -o mac.sig
          test -s win.sig && test -s mac.sig
          node -e "
            const fs = require('fs');
            const manifest = {
              version: process.argv[1],
              notes: 'LiveGuard ' + process.argv[2] + ' — xem release notes tại https://github.com/' + process.argv[3] + '/releases/tag/' + process.argv[2],
              pub_date: new Date().toISOString().replace(/\\.\\d+Z$/, 'Z'),
              platforms: {
                'windows-x86_64': { signature: fs.readFileSync('win.sig', 'utf8'), url: process.argv[4] },
                'darwin-x86_64':  { signature: fs.readFileSync('mac.sig', 'utf8'), url: process.argv[5] },
                'darwin-aarch64': { signature: fs.readFileSync('mac.sig', 'utf8'), url: process.argv[5] },
              },
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          " "$VERSION" "$TAG" "$GITHUB_REPOSITORY" "$DL/$WIN_ZIP" "$DL/$MAC_TGZ"
          node -e "const j=JSON.parse(require('fs').readFileSync('latest.json','utf8')); const ok=Object.values(j.platforms).every(p=>p.signature.length>100 && p.url.startsWith('https://')); if(!ok){console.error('latest.json không hợp lệ');process.exit(1)} console.log('latest.json OK — platforms:',Object.keys(j.platforms).join(', '))"
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"